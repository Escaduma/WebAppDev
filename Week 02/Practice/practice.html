<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--Linking .css files goes on the head tag-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <!--A generic container, no meaning by itself, used for styling and layout-->
    </div>

    <!--Semantic Tags-->
    <header>
        <!-- to section of the page or a section, usually with a logo/titles/intro-->
    </header>

    <nav>
        <!-- Contains navegation links, tells the browser/screen "This is the site Menu" -->
    </nav>

    <main>
        <!-- This is the bread and butter of your website -->
    </main>

    <section>
        <!-- Section tags will be inside the <main> Tags, groups related content think of it like chapters in a book -->
    </section>

    <footer>
        <!-- Bottom of the page or section, usually with copyright or contact info -->
    </footer>

    <!-- SEMANTIC VERSION-->
    <header>
        <h1>My Website</h1>
    </header>
    <nav>
        <a href="indext.html">Home</a>
        <a href="about.html">About</a>
    </nav>
    <main>
        <section>
            <h2>About me</h2>
            <p>I am a student</p>
        </section>
    </main>
    <footer>
        <p>2025 My Website</p>
    </footer>

    <!-- Lists -->
    <ul>
        <!-- unordered lists, bullet points-->
    </ul>

    <ol>
        <!-- Ordered list, numbered-->
    </ol>

    <li>
        <!--List Items-->
    </li>

    <!-- Example -->
     <ul>
        <li>Oranges</li>
        <li>Apples</li>
     </ul>

     <ol>
        <li>Pizza</li>
        <li>Burgers</li>
     </ol>

    <!--Tables-->
    <table>
        <!--Table Container-->
    </table>

    <tr>
        <!--Table Row-->
    </tr>

    <th>
        <!--Table Header, only used once-->
    </th>

    <td>
        <!--Table Data-->
    </td>

    <!--Example-->
    <table border="1px">
        <tr>
            <th>Column 1</th>
            <th>Column 2</th>
        </tr>
        <tr>
            <td>Data 1</td>
            <td>Data 2</td>
        </tr>
    </table>

</body>
</html>
