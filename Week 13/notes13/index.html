<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <form id="contactForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required minlength="4" placeholder="Enter a username">
        <!-- type -> identifies the input as a text field
        id-> allows JavaScript to locvate the element
        required-> prevents the user from submittin an empty field
        minlength-> requires at least foru characters
        placeholder-> dsiplay example text inside the field -->
        <br><br>

        <label for="city">City:</label>
        <input type="text" id="city">
        <br><br>

        <label for="favoriteColor">Favorite Color:</label>
        <input type="text" id="favoriteColor">
        <p id="colorMessage"></p>
        <br>

        <label for="favoriteGame">Favorite Game:</label>
        <input type="text" id="favoriteGame">
        <p id="gameMessage"></p>
        <br>

        <label for="search">Search Input:</label>
        <input type="text" id="search">
        <br>

        <button type="submit">Submit</button>

    </form>
   
    
</body>
</html>
